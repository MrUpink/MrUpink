plugins {
    id 'com.android.application'
}

android {
    namespace 'id.pintarceria.app'
    compileSdk 34

    defaultConfig {
        applicationId 'id.pintarceria.app'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Untuk rilis Play Store, ganti dengan keystore milik Anda sendiri.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
