plugins {
    id 'com.android.application'
}

android {
    namespace 'id.autotube.app'
    compileSdk 34

    defaultConfig {
        applicationId 'id.autotube.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
