name: Uji Suara VoxCPM2

# Membuat contoh suara dengan VoxCPM2 (Apache-2.0) untuk didengarkan sebelum dipakai di aplikasi.
on:
  workflow_dispatch:

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang VoxCPM2 (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install voxcpm
      - name: Buat contoh suara
        run: python tools/voice/voxcpm_trial.py voxcpm-trial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contoh-suara-voxcpm2
          path: voxcpm-trial/*.mp3
