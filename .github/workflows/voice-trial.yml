name: Uji Suara VoxCPM2

# Membuat contoh suara dengan VoxCPM2 (Apache-2.0) untuk didengarkan sebelum dipakai di aplikasi.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang VoxCPM2 (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install voxcpm
      - name: Bandingkan mode perekaman
        run: |
          pip install faster-whisper
          node tools/voice/phrases.js > phrases.json
          python tools/voice/voxcpm_compare.py phrases.json voxcpm-trial 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perbandingan-mode
          path: voxcpm-trial/*.mp3
